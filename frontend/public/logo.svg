<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>WatchWithMi</title>
  <!-- Solid shapes, not strokes: a 24px stroke on a 512 canvas renders at
       0.75px in a 16px favicon and vanishes. Transparent background so the
       mark reads on both themes. The colour is literal because an external
       SVG loaded through img gets no CSS from the host page; keep it in step
       with the accent in globals.css. Do not write a double hyphen anywhere
       in this comment, XML forbids it and the whole file fails to parse. -->
