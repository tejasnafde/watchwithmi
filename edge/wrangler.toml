name = "watchwithmi-proxy"
main = "src/index.js"
compatibility_date = "2026-07-20"
workers_dev = false

# custom_domain = true means Cloudflare creates and owns the DNS record for
# this hostname. Do NOT also add a record for `watchwithmi` with dns.sh.
routes = [
  { pattern = "watchwithmi.tn07.dev", custom_domain = true }
]
